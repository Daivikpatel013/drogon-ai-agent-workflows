<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ff7a18" />
      <stop offset="50%" stop-color="#af002d" />
      <stop offset="100%" stop-color="#32008c" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#g)" />
  <g transform="translate(0,20)">
    <circle cx="200" cy="120" r="80" fill="#ffffff22">
      <animate attributeName="cy" dur="6s" values="120;60;120;180;120" repeatCount="indefinite" />
    </circle>
    <circle cx="540" cy="140" r="110" fill="#ffffff11">
      <animate attributeName="cy" dur="7s" values="140;80;140;200;140" repeatCount="indefinite" />
    </circle>
    <circle cx="880" cy="120" r="90" fill="#ffffff22">
      <animate attributeName="cy" dur="5.5s" values="120;40;120;180;120" repeatCount="indefinite" />
    </circle>
  </g>
  <text x="600" y="260" font-size="48" text-anchor="middle" fill="#fff" font-family="Segoe UI, Roboto, Arial" font-weight="700">Surprise!</text>
  <text x="600" y="310" font-size="20" text-anchor="middle" fill="#fff8" font-family="Segoe UI, Roboto, Arial">You just found an Easter egg — thanks for looking 👀</text>
  <g opacity="0.9">
    <rect x="380" y="335" rx="6" width="440" height="56" fill="#00000020" />
    <text x="600" y="372" text-anchor="middle" fill="#fff" font-size="14">If you'd like, I can replace the diagrams with polished images or keep this surprise.</text>
  </g>
</svg>
