<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <rect width="100%" height="100%" fill="#0f1720" />
  <g font-family="Arial" fill="#cbd5e1" font-size="14">
    <rect x="40" y="40" width="220" height="80" rx="8" fill="#111827" stroke="#374151" />
    <text x="150" y="70" text-anchor="middle" fill="#fff" font-weight="700">Candidate Intake</text>
    <text x="150" y="92" text-anchor="middle">Form / Data table</text>

    <rect x="320" y="40" width="260" height="80" rx="8" fill="#111827" stroke="#374151" />
    <text x="450" y="70" text-anchor="middle" fill="#fff" font-weight="700">Job Discovery</text>
    <text x="450" y="92" text-anchor="middle">Apify / LinkedIn scraper</text>

    <rect x="640" y="40" width="240" height="80" rx="8" fill="#111827" stroke="#374151" />
    <text x="760" y="70" text-anchor="middle" fill="#fff" font-weight="700">AI Scoring</text>
    <text x="760" y="92" text-anchor="middle">LangChain / GPT models</text>

    <rect x="920" y="40" width="240" height="80" rx="8" fill="#111827" stroke="#374151" />
    <text x="1040" y="70" text-anchor="middle" fill="#fff" font-weight="700">Application Prep</text>
    <text x="1040" y="92" text-anchor="middle">Resume &amp; Cover Letter</text>

    <line x1="260" y1="80" x2="320" y2="80" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)" />
    <line x1="580" y1="80" x2="640" y2="80" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)" />
    <line x1="880" y1="80" x2="920" y2="80" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)" />

    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
        <path d="M0,0 L0,6 L6,3 z" fill="#9ca3af" />
      </marker>
    </defs>

    <rect x="40" y="160" width="320" height="60" rx="8" fill="#0b1220" stroke="#374151" />
    <text x="200" y="192" text-anchor="middle">Logging & Tracking</text>
    <text x="200" y="208" text-anchor="middle">Google Sheets / Gap tracker</text>

    <rect x="400" y="160" width="320" height="60" rx="8" fill="#0b1220" stroke="#374151" />
    <text x="560" y="192" text-anchor="middle">Delivery</text>
    <text x="560" y="208" text-anchor="middle">Gmail / Manual review digest</text>

    <line x1="760" y1="100" x2="760" y2="160" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)" />
    <line x1="200" y1="220" x2="560" y2="220" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)" />

    <text x="600" y="260" fill="#94a3b8" font-size="12">Schedules: daily run (8am), weekly summary (Mon 9am)</text>
  </g>
</svg>
