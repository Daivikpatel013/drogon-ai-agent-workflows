<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700">
  <defs>
    <linearGradient id="bg3" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111f2e"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="700" fill="url(#bg3)"/>
  <rect x="60" y="50" width="1280" height="600" rx="18" fill="#111827" stroke="#dfe6f3" stroke-width="2"/>

  <g font-family="Segoe UI, Arial, sans-serif" fill="#e2e8f0">
    <text x="700" y="110" text-anchor="middle" font-size="30" font-weight="700">Weekly Skills Summary</text>

    <rect x="120" y="190" width="250" height="120" rx="16" fill="#121c2b" stroke="#4b5563"/>
    <text x="245" y="240" text-anchor="middle" font-size="22" font-weight="700">Gather Gaps</text>
    <text x="245" y="270" text-anchor="middle" font-size="15" fill="#b8c2d9">Track missing skills</text>

    <rect x="440" y="190" width="260" height="120" rx="16" fill="#121c2b" stroke="#4b5563"/>
    <text x="570" y="240" text-anchor="middle" font-size="22" font-weight="700">Aggregate</text>
    <text x="570" y="270" text-anchor="middle" font-size="15" fill="#b8c2d9">Most common gaps</text>

    <rect x="780" y="190" width="260" height="120" rx="16" fill="#121c2b" stroke="#4b5563"/>
    <text x="910" y="240" text-anchor="middle" font-size="22" font-weight="700">Email Candidate</text>
    <text x="910" y="270" text-anchor="middle" font-size="15" fill="#b8c2d9">Weekly summary</text>

    <path d="M370 250 H440" stroke="#dfe6f3" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M700 250 H780" stroke="#dfe6f3" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

    <rect x="290" y="430" width="820" height="130" rx="14" fill="#0b1220" stroke="#4b5563"/>
    <text x="700" y="490" text-anchor="middle" font-size="22" font-weight="700">Outcome</text>
    <text x="700" y="520" text-anchor="middle" font-size="16" fill="#b8c2d9">Clear coaching direction for the next week of job search and skills-building</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dfe6f3"/>
    </marker>
  </defs>
</svg>
