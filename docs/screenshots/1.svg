<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="bg1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0a1320"/>
      <stop offset="100%" stop-color="#101d2c"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0d1727"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="900" fill="url(#bg1)"/>
  <rect x="26" y="26" width="1348" height="848" rx="18" fill="none" stroke="#f1f5f9" stroke-width="2" opacity="0.85"/>

  <g font-family="Segoe UI, Arial, sans-serif" fill="#e5e7eb">
    <text x="700" y="80" text-anchor="middle" font-size="28" font-weight="700">Drogon AI Agent System</text>

    <rect x="120" y="160" width="260" height="110" rx="18" fill="url(#card)" stroke="#364152"/>
    <text x="250" y="205" text-anchor="middle" font-size="24" font-weight="700">Candidate Intake</text>
    <text x="250" y="236" text-anchor="middle" font-size="15" fill="#b8c2d9">Form + resume input</text>

    <rect x="430" y="160" width="290" height="110" rx="18" fill="url(#card)" stroke="#364152"/>
    <text x="575" y="205" text-anchor="middle" font-size="24" font-weight="700">Job Discovery</text>
    <text x="575" y="236" text-anchor="middle" font-size="15" fill="#b8c2d9">Apify / LinkedIn search</text>

    <rect x="770" y="160" width="250" height="110" rx="18" fill="url(#card)" stroke="#364152"/>
    <text x="895" y="205" text-anchor="middle" font-size="24" font-weight="700">AI Scoring</text>
    <text x="895" y="236" text-anchor="middle" font-size="15" fill="#b8c2d9">Fit check + ranking</text>

    <rect x="1060" y="160" width="230" height="110" rx="18" fill="url(#card)" stroke="#364152"/>
    <text x="1175" y="205" text-anchor="middle" font-size="24" font-weight="700">Application Prep</text>
    <text x="1175" y="236" text-anchor="middle" font-size="15" fill="#b8c2d9">CV + cover letter</text>

    <path d="M380 215 H430" stroke="#cbd5e1" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M720 215 H770" stroke="#cbd5e1" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M1020 215 H1060" stroke="#cbd5e1" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

    <path d="M890 270 L890 360" stroke="#cbd5e1" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

    <rect x="230" y="360" width="330" height="110" rx="18" fill="#0f1727" stroke="#364152"/>
    <text x="395" y="405" text-anchor="middle" font-size="22" font-weight="700">Logging &amp; Tracking</text>
    <text x="395" y="436" text-anchor="middle" font-size="15" fill="#b8c2d9">Google Sheets / gap data</text>

    <rect x="650" y="360" width="340" height="110" rx="18" fill="#0f1727" stroke="#364152"/>
    <text x="820" y="405" text-anchor="middle" font-size="22" font-weight="700">Delivery</text>
    <text x="820" y="436" text-anchor="middle" font-size="15" fill="#b8c2d9">Email digest + review loop</text>

    <path d="M560 415 H650" stroke="#cbd5e1" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

    <rect x="300" y="560" width="800" height="180" rx="20" fill="#0b1220" stroke="#364152"/>
    <text x="700" y="612" text-anchor="middle" font-size="26" font-weight="700">Operational Flow</text>
    <text x="700" y="655" text-anchor="middle" font-size="18" fill="#b8c2d9">Candidates → jobs → AI ranking → tailored CVs → recruiter contact → weekly skills summary</text>
    <text x="700" y="688" text-anchor="middle" font-size="16" fill="#93a3ba">Daily automation with human review before sending applications</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dbe4f1"/>
    </marker>
  </defs>
</svg>
